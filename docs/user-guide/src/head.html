<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>হজ ট্র্যাকিং: এজেন্সির ব্যবহার নির্দেশিকা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12302e; --ink-2: #44605d; --ink-3: #5e7471;
    --ground: #f4f6f5; --line: #e1e9e7; --line-strong: #c9d6d3;
    --haram: #0b7a6f; --haram-deep: #075e55; --haram-night: #0b4f4a; --haram-tint: #ddf1ee;
    --saffron: #f2b33d; --saffron-ink: #8a5a00; --saffron-tint: #fff3d6;
    --danger: #b42318; --danger-tint: #fdecea;
  }
  @page { size: A4; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font-family: "Anek Bangla", sans-serif; font-size: 10.6pt; line-height: 1.62; color: var(--ink); background: #fff; }
  h1, h2, h3 { font-weight: 700; line-height: 1.3; break-after: avoid; }
  h1 { font-family: "Tiro Bangla", serif; font-weight: 400; font-size: 23pt; margin: 0 0 6pt; display: flex; align-items: center; gap: 10pt; color: var(--haram-night); }
  h1 .num { display: inline-grid; place-items: center; min-width: 34pt; height: 34pt; padding: 0 6pt; border-radius: 17pt 17pt 6pt 6pt; background: var(--haram); color: #fff; font-family: "Anek Bangla", sans-serif; font-weight: 700; font-size: 15pt; }
  h2 { font-size: 14pt; margin: 18pt 0 6pt; color: var(--haram-deep); padding-bottom: 3pt; border-bottom: 1.5pt solid var(--haram-tint); }
  h3 { font-size: 11.5pt; margin: 13pt 0 4pt; }
  p { margin: 0 0 7pt; }
  a { color: var(--haram-deep); text-decoration: none; border-bottom: 0.6pt solid currentColor; }
  ul, ol { margin: 0 0 8pt; padding-left: 18pt; }
  li { margin-bottom: 3pt; }
  b { font-weight: 600; }

  .chapter { break-before: page; }
  .where { background: var(--ground); border-radius: 6pt; padding: 5pt 9pt; font-size: 9.4pt; color: var(--ink-2); margin: 0 0 10pt; }
  .where b { color: var(--ink); margin-right: 3pt; }
  .where b:not(:first-child) { margin-left: 12pt; }

  figure { margin: 8pt 0 12pt; break-inside: avoid; text-align: center; }
  figure img { display: block; width: 100%; border: 0.75pt solid var(--line-strong); border-radius: 6pt; }
  figure.half img { width: 82%; margin: 0 auto; }
  figure.phone img { width: 58mm; margin: 0 auto; border-radius: 10pt; }
  figure.pair { display: flex; gap: 8pt; align-items: flex-start; justify-content: center; }
  figure.pair > div { flex: 1; }
  figure.pair.phones > div { flex: 0 0 58mm; }
  figure.pair.phones img { width: 58mm; border-radius: 10pt; }
  figcaption { font-size: 8.8pt; color: var(--ink-3); margin-top: 4pt; }

  ol.steps { list-style: none; padding: 0; counter-reset: s; }
  ol.steps > li { counter-increment: s; position: relative; padding-left: 26pt; margin-bottom: 6pt; }
  ol.steps > li::before { content: counter(s, bengali); position: absolute; left: 0; top: 0.5pt; width: 18pt; height: 18pt; border-radius: 9pt 9pt 3pt 3pt; background: var(--haram); color: #fff; font-weight: 700; font-size: 9pt; display: grid; place-items: center; line-height: 1; }
  ol.flow { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 4pt 2pt; counter-reset: f; }
  ol.flow li { counter-increment: f; background: var(--haram-tint); color: var(--haram-deep); font-weight: 600; font-size: 9.4pt; padding: 2pt 8pt; border-radius: 10pt; margin: 0; }
  ol.flow li::before { content: counter(f, bengali) ". "; }
  ol.flow li:not(:last-child)::after { content: "  →"; color: var(--ink-3); }
  ol.check { list-style: none; padding: 0; }
  ol.check li { padding-left: 18pt; position: relative; }
  ol.check li::before { content: ""; position: absolute; left: 0; top: 3.5pt; width: 10pt; height: 10pt; border: 1.2pt solid var(--haram); border-radius: 2.5pt; }

  .tip, .warn, .fix, .note { border-radius: 6pt; padding: 7pt 10pt; margin: 8pt 0 10pt; font-size: 9.9pt; break-inside: avoid; border-left: 3pt solid; }
  .tip { background: var(--haram-tint); border-color: var(--haram); }
  .warn { background: var(--danger-tint); border-color: var(--danger); }
  .fix { background: var(--saffron-tint); border-color: var(--saffron); }
  .note { background: var(--ground); border-color: var(--line-strong); color: var(--ink-2); }

  table { width: 100%; border-collapse: collapse; margin: 6pt 0 10pt; font-size: 9.6pt; break-inside: auto; }
  tr { break-inside: avoid; }
  table.kv th { text-align: left; vertical-align: top; width: 33%; padding: 4pt 8pt 4pt 0; font-weight: 600; border-bottom: 0.6pt solid var(--line); }
  table.kv td { padding: 4pt 0; border-bottom: 0.6pt solid var(--line); color: var(--ink-2); }
  table.grid th, table.grid td { border: 0.6pt solid var(--line-strong); padding: 3.5pt 6pt; text-align: left; vertical-align: top; }
  table.grid thead th { background: var(--ground); font-weight: 600; }
  table.grid td.r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.example { width: 78%; break-inside: avoid; }
  table.example tr.total td { font-weight: 700; background: var(--haram-tint); }
  .formula { background: #fbfcfb; border: 0.75pt dashed var(--line-strong); border-radius: 6pt; padding: 7pt 11pt; margin: 6pt 0 10pt; break-inside: avoid; }
  .formula p { margin: 2pt 0; }

  /* cover */
  .cover { height: 267mm; display: flex; flex-direction: column; justify-content: space-between; background: var(--haram-night); color: #fff; border-radius: 10pt; padding: 26mm 18mm 18mm; position: relative; overflow: hidden; }
  .cover .brand { display: flex; align-items: center; gap: 10pt; font-size: 13pt; font-weight: 600; }
  .cover .brand span { width: 30pt; height: 30pt; border-radius: 9pt; background: var(--saffron); display: grid; place-items: center; color: var(--haram-night); font-weight: 700; }
  .cover h1 { color: #fff; font-size: 36pt; display: block; margin: 0 0 10pt; line-height: 1.25; }
  .cover .sub { font-size: 14pt; color: rgba(255,255,255,.82); max-width: 135mm; }
  .cover .meta { font-size: 10pt; color: rgba(255,255,255,.72); border-top: 0.75pt solid rgba(255,255,255,.25); padding-top: 9pt; display: flex; justify-content: space-between; }
  .cover .shot { display: block; width: 168mm; margin: 0 -34mm 0 auto; border-radius: 8pt; box-shadow: 0 10pt 30pt rgba(0,0,0,.35); }
  .cover { overflow: hidden; }

  .toc { columns: 2; column-gap: 12mm; padding: 0; list-style: none; counter-reset: t; }
  .toc li { counter-increment: t; break-inside: avoid; padding: 4pt 0; border-bottom: 0.6pt dotted var(--line-strong); display: flex; gap: 8pt; }
  .toc li::before { content: counter(t, bengali); color: var(--haram); font-weight: 700; min-width: 16pt; }
  .toc a { border: 0; color: var(--ink); }
  .toc small { display: block; color: var(--ink-3); font-size: 8.6pt; }
  .lead { font-size: 11.6pt; color: var(--ink-2); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10pt; }
</style>
</head>
<body>
